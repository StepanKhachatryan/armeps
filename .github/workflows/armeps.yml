name: ARMEPS monitor

on:
  schedule:
    - cron: "17 5,11 * * *"   # 09:17 and 15:17 Yerevan time (UTC+4)
  workflow_dispatch:
    inputs:
      inspect:
        description: "Space-separated URLs to inspect (prints forms/links instead of checking)"
        required: false
        default: ""
      recheck_seen:
        description: "Also re-check announcements already reported before"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency: armeps-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Inspect pages
        if: inputs.inspect != ''
        env:
          INSPECT_FULL_TEXT: "1"
        run: python armeps_monitor.py --inspect ${{ inputs.inspect }}

      - name: Check ARMEPS
        id: check
        if: inputs.inspect == ''
        run: python armeps_monitor.py --dump-html debug_html ${{ inputs.recheck_seen && '--all' || '' }}

      - name: Open issue with new announcements
        if: steps.check.outputs.new_count != '0' && steps.check.outputs.new_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "ARMEPS: ${{ steps.check.outputs.new_count }} new announcement(s) $(date -u +%F)" \
            --body-file new_announcements.md

      - name: Save seen IDs
        if: inputs.inspect == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update seen ARMEPS announcements"
          git push

      - name: Upload fetched HTML (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armeps-html
          path: debug_html
          retention-days: 3

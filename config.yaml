# ARMEPS procurement monitor configuration.
# A tender matches if its row text (or detail page text, when fetch_details is true)
# contains ANY of `keywords` and NONE of `exclude_keywords`. Matching is case-insensitive.
# Write keywords in every language the announcements may use (Armenian / English / Russian).

# Run the site's own quick search (home page form, "ՄՀ-ներ" = calls for tender) once per keyword.
quick_search: true

# Extra result-page URLs to scan (optional, fetched with GET).
search_urls: []

keywords:
  - համակարգիչ        # computer
  - computer
  - ծրագրային         # software
  - software
  - սերվեր            # server
  - server

exclude_keywords: []

# Skip tenders that list any of these CPV codes (8 digits; the "-N" check digit is ignored).
exclude_cpv:
  - "71351540"

# Skip tenders published more than this many months ago (by "Date of Publication/Invitation").
# Tenders whose submission deadline has already passed are always skipped.
max_age_months: 3

# Follow pagination links found on the results page (max pages per search URL).
max_pages: 5

# Also match keywords against each tender's detail page text (slower, more accurate).
# Detail pages are always downloaded for keyword matches, to check CPV codes and dates.
fetch_details: false

# Seconds to wait between HTTP requests (be polite to the server).
request_delay: 1.5
